name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-24.04
            compiler: gcc-14
            cxx: g++-14
            cc: gcc-14
          - os: ubuntu-24.04
            compiler: clang-18
            cxx: clang++-18
            cc: clang-18
          - os: windows-latest
            compiler: msvc
            cxx: cl
            cc: cl
          - os: macos-14
            compiler: appleclang
            cxx: clang++
            cc: clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Linux Compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc-14" ]; then
            sudo apt-get install -y gcc-14 g++-14
          elif [ "${{ matrix.compiler }}" = "clang-18" ]; then
            sudo apt-get install -y clang-18
          fi

      - name: Setup Windows Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DARGPARSE_BUILD_TESTS=ON
          -DARGPARSE_BUILD_EXAMPLES=ON
          -DARGPARSE_WARNINGS_AS_ERRORS=ON
        env:
          CXX: ${{ matrix.cxx }}
          CC: ${{ matrix.cc }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run Tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: Linux Clang-18 ASan & UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18

      - name: Configure with Sanitizers
        run: >
          cmake -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DARGPARSE_BUILD_TESTS=ON
          -DARGPARSE_BUILD_EXAMPLES=OFF
          -DARGPARSE_WARNINGS_AS_ERRORS=ON

      - name: Build with Sanitizers
        run: cmake --build build-san --parallel

      - name: Run Tests with Sanitizers
        run: ctest --test-dir build-san --output-on-failure
        env:
          ASAN_OPTIONS: "check_initialization_order=1:strict_init_order=1"
          UBSAN_OPTIONS: "print_stacktrace=1"

  single-header-verification:
    name: Single-Header Generation & Verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Run Amalgamation Script
        run: python3 scripts/amalgamate.py

      - name: Test Single Header Compilation
        run: |
          g++-14 -std=c++23 -Wall -Wextra -Werror -I single_include \
            tests/test_single_header.cpp -o test_single_header
          ./test_single_header
